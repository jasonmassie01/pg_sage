name: Performance gate

# The performance gate alone, on demand: the same clean server and tests as
# the nightly CI run, without the hour of other suites before it, so a fix
# can be checked at the large scale on any branch:
#   gh workflow run perfgate.yml --ref <branch> -f scale=large
on:
  workflow_dispatch:
    inputs:
      scale:
        description: "Fixture scale: small or large"
        required: false
        default: large

permissions:
  contents: read
  packages: read

jobs:
  perfgate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # ci-03b: CI's PostgreSQL image (HypoPG, pg_hint_plan and the test
    # server settings baked in), clean, the gate's alone.
    services:
      postgres:
        image: ghcr.io/jasonmassie01/pg_sage-ci-pgvector:0.8.2-pg17-r2
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      - name: Check the PostgreSQL server (CI image)
        run: scripts/ci/verify-test-postgres.sh ${{ job.services.postgres.id }} 17

      - name: Performance gate
        working-directory: sidecar
        timeout-minutes: 35
        env:
          SAGE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          PG_SAGE_PERF_SCALE: ${{ inputs.scale }}
          PG_SAGE_PERF_REPORT: ${{ github.workspace }}/perfgate/report.md
        run: |
          go test ./cmd/pg_sage_sidecar -tags=perfgate \
            -run '^(TestPerfGate|TestPerfGateFirstLook)$' -count=1 -timeout 2000s -v

      - name: Upload performance gate report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: perfgate-${{ inputs.scale }}
          path: perfgate/
          if-no-files-found: warn
