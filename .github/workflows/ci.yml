name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  # Nightly: the performance gate at the large scale (5,000 tables).
  schedule:
    - cron: "17 6 * * *"
  # Manual runs, e.g. the first live-model arm after its secret is set.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/jasonmassie01/pg_sage-ci-pgvector:0.8.2-pg17
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      SAGE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      SAGE_BENCH_REPORT_DIR: ${{ github.workspace }}/pgincidentbench
      # Roadmap 1.1: every PGIncidentBench report names the pg_sage build it
      # scored, so a sidecar refuses a report made for another build.
      SAGE_BENCH_PG_SAGE_COMMIT: ${{ github.sha }}
      SAGE_BENCH_PG_SAGE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare PostgreSQL (HypoPG, pg_hint_plan, pg_stat_statements)
        run: scripts/ci/setup-test-postgres.sh ${{ job.services.postgres.id }} 17

      - name: Verify and build frontend
        working-directory: sidecar/web
        run: |
          npm ci
          npm run lint
          npm run test -- --maxWorkers=2
          npm run build

      - name: Go vet
        working-directory: sidecar
        run: go vet ./...

      # Each suite writes go test -json for the skip budget and prints the
      # verbose log; the step fails with the suite's own exit status.
      - name: Unit tests (race detector)
        working-directory: sidecar
        run: |
          status=0
          go test ./... -race -cover -count=1 -timeout 900s -json > ../unit.json || status=$?
          jq -rj 'select(.Action=="output") | .Output' ../unit.json
          exit $status

      - name: Integration tests
        working-directory: sidecar
        run: |
          status=0
          go test ./... -cover -tags=integration -count=1 -timeout 600s -json \
            > ../integration.json || status=$?
          jq -rj 'select(.Action=="output") | .Output' ../integration.json
          exit $status

      - name: Sidecar end-to-end tests
        working-directory: sidecar
        run: |
          status=0
          go test ./e2e -cover -tags=e2e -count=1 -timeout 900s -json > ../e2e.json || status=$?
          jq -rj 'select(.Action=="output") | .Output' ../e2e.json
          exit $status

      # Performance gate: the real runtime against a large synthetic catalog
      # with pre-seeded sage history; fails on a seq scan of a large sage
      # table, slow statements, O(objects) writes or a catalog query over
      # the 500 ms incident budget (internal/testsupport/perfgate/budgets.go).
      # Pull requests run the small scale; the nightly run the large one.
      # Blocking: any offender fails the build.
      # The gate gets a fresh server of its own: the shared one holds what the
      # suites above left behind, and cluster-wide reads (the databases'
      # total size stats every file of every database) would charge pg_sage
      # for it (153 ms there, 40 ms on a clean server, nightly 2026-10-07).
      - name: Log in to the GitHub container registry
        if: ${{ !cancelled() }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" |
          docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start a clean PostgreSQL for the performance gate
        if: ${{ !cancelled() }}
        run: |
          docker run -d --name perfgate-pg -e POSTGRES_PASSWORD=postgres \
            -p 5433:5432 ghcr.io/jasonmassie01/pg_sage-ci-pgvector:0.8.2-pg17 >/dev/null
          for _ in $(seq 1 60); do
            docker exec perfgate-pg pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          scripts/ci/setup-test-postgres.sh perfgate-pg 17

      - name: Performance gate
        if: ${{ !cancelled() }}
        working-directory: sidecar
        timeout-minutes: 25
        env:
          SAGE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5433/postgres?sslmode=disable
          PG_SAGE_PERF_SCALE: ${{ github.event_name == 'schedule' && 'large' || 'small' }}
          PG_SAGE_PERF_REPORT: ${{ github.workspace }}/perfgate/report.md
        run: |
          go test ./cmd/pg_sage_sidecar -tags=perfgate -run '^TestPerfGate$' -count=1 \
            -timeout 1500s -v

      - name: Upload performance gate report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: perfgate-pg17
          path: perfgate/
          if-no-files-found: warn

      # The bench runs in shards by incident family (SAGE_BENCH_FAMILIES), each
      # its own step under 20 minutes, so it neither crowds the ./... suites
      # nor needs one long timeout. Every bench family must be in exactly one
      # shard (sre-bench/ci_split_test.go). The later shards run even when
      # an earlier shard failed.
      - name: PGIncidentBench (core families)
        id: bench-core
        working-directory: sidecar
        timeout-minutes: 40
        env:
          SAGE_BENCH_RUN: "1"
          SAGE_BENCH_FAMILIES: lock_blocking,connection_pressure,wal_retention,plan_regression
          SAGE_BENCH_REPORT_DIR: ${{ github.workspace }}/pgincidentbench/core
          # A release report must meet the promotion bar's n >= 10 per
          # family (the smallest family has 3 scored scenarios).
          SAGE_BENCH_REPEATS: ${{ startsWith(github.ref, 'refs/tags/v') && '4' || '1' }}
        run: |
          status=0
          go test ./sre-bench -run '^TestPGIncidentBench$' -count=1 -timeout 2400s -json \
            > ../bench-core.json || status=$?
          jq -rj 'select(.Action=="output") | .Output' ../bench-core.json
          exit $status

      - name: PGIncidentBench (M6 reactive families)
        if: ${{ !cancelled() && steps.bench-core.conclusion != 'skipped' }}
        working-directory: sidecar
        timeout-minutes: 40
        env:
          SAGE_BENCH_RUN: "1"
          SAGE_BENCH_FAMILIES: checkpoint_storm,temp_file_explosion,replication_lag,lwlock_contention
          SAGE_BENCH_REPORT_DIR: ${{ github.workspace }}/pgincidentbench/reactive
          # A release report must meet the promotion bar's n >= 10 per
          # family (the smallest family has 3 scored scenarios).
          SAGE_BENCH_REPEATS: ${{ startsWith(github.ref, 'refs/tags/v') && '4' || '1' }}
        run: |
          status=0
          go test ./sre-bench -run '^TestPGIncidentBench$' -count=1 -timeout 2400s -json \
            > ../bench-reactive.json || status=$?
          jq -rj 'select(.Action=="output") | .Output' ../bench-reactive.json
          exit $status

      - name: PGIncidentBench (M6 runway families)
        if: ${{ !cancelled() && steps.bench-core.conclusion != 'skipped' }}
        working-directory: sidecar
        timeout-minutes: 40
        env:
          SAGE_BENCH_RUN: "1"
          SAGE_BENCH_FAMILIES: wraparound_runway,disk_wal_runway,sequence_runway
          SAGE_BENCH_REPORT_DIR: ${{ github.workspace }}/pgincidentbench/runway
          # A release report must meet the promotion bar's n >= 10 per
          # family (the smallest family has 3 scored scenarios).
          SAGE_BENCH_REPEATS: ${{ startsWith(github.ref, 'refs/tags/v') && '4' || '1' }}
        run: |
          status=0
          go test ./sre-bench -run '^TestPGIncidentBench$' -count=1 -timeout 2400s -json \
            > ../bench-runway.json || status=$?
          jq -rj 'select(.Action=="output") | .Output' ../bench-runway.json
          exit $status

      # PGIncidentBench writes its JSON result and Markdown summary here.
      - name: Upload PGIncidentBench report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pgincidentbench-pg17
          path: pgincidentbench/
          if-no-files-found: warn

      # Fails on any skipped test not justified in sidecar/.skip-allowlist.
      - name: Skip budget
        if: ${{ !cancelled() }}
        working-directory: sidecar
        run: cat ../unit.json ../integration.json ../e2e.json | go run ./cmd/skipbudget

  # PostgreSQL 17 runs in the test job above; this covers the rest of the
  # supported range with the race detector and integration tags.
  integration-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["14", "15", "16", "18"]
    services:
      postgres:
        image: ghcr.io/jasonmassie01/pg_sage-ci-pgvector:0.8.2-pg${{ matrix.pg }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      SAGE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      - name: Prepare PostgreSQL ${{ matrix.pg }}
        run: scripts/ci/setup-test-postgres.sh ${{ job.services.postgres.id }} ${{ matrix.pg }}

      - name: Integration tests (race detector)
        working-directory: sidecar
        run: |
          status=0
          go test ./... -race -tags=integration -count=1 -timeout 1200s -json \
            > ../integration.json || status=$?
          jq -rj 'select(.Action=="output") | .Output' ../integration.json
          exit $status

      # The same shards as the PostgreSQL 17 job: the M6 probes have
      # per-version variants (pg_stat_bgwriter vs pg_stat_checkpointer,
      # pg_stat_wal columns removed in 18), so every family runs on every
      # version.
      - name: PGIncidentBench (core families)
        id: bench-core
        working-directory: sidecar
        timeout-minutes: 40
        env:
          SAGE_BENCH_RUN: "1"
          SAGE_BENCH_FAMILIES: lock_blocking,connection_pressure,wal_retention,plan_regression
        run: |
          status=0
          go test ./sre-bench -run '^TestPGIncidentBench$' -count=1 -timeout 2400s -json \
            > ../bench-core.json || status=$?
          jq -rj 'select(.Action=="output") | .Output' ../bench-core.json
          exit $status

      - name: PGIncidentBench (M6 reactive families)
        if: ${{ !cancelled() && steps.bench-core.conclusion != 'skipped' }}
        working-directory: sidecar
        timeout-minutes: 40
        env:
          SAGE_BENCH_RUN: "1"
          SAGE_BENCH_FAMILIES: checkpoint_storm,temp_file_explosion,replication_lag,lwlock_contention
        run: |
          status=0
          go test ./sre-bench -run '^TestPGIncidentBench$' -count=1 -timeout 2400s -json \
            > ../bench-reactive.json || status=$?
          jq -rj 'select(.Action=="output") | .Output' ../bench-reactive.json
          exit $status

      - name: PGIncidentBench (M6 runway families)
        if: ${{ !cancelled() && steps.bench-core.conclusion != 'skipped' }}
        working-directory: sidecar
        timeout-minutes: 40
        env:
          SAGE_BENCH_RUN: "1"
          SAGE_BENCH_FAMILIES: wraparound_runway,disk_wal_runway,sequence_runway
        run: |
          status=0
          go test ./sre-bench -run '^TestPGIncidentBench$' -count=1 -timeout 2400s -json \
            > ../bench-runway.json || status=$?
          jq -rj 'select(.Action=="output") | .Output' ../bench-runway.json
          exit $status

      - name: Skip budget
        if: ${{ !cancelled() }}
        working-directory: sidecar
        run: go run ./cmd/skipbudget < ../integration.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: sidecar
          version: v2.11.4
          args: --timeout 5m

  # Roadmap 1.1: sign this commit's PGIncidentBench reports keyless
  # (Sigstore, GitHub OIDC; no key to keep) for the image and the release.
  # Verified twice before anything ships them: by cosign and by pg_sage's
  # own verifier with the trusted root the binaries will embed.
  bench-sign:
    runs-on: ubuntu-latest
    needs: test
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      - uses: actions/download-artifact@v4
        with:
          name: pgincidentbench-pg17
          path: sidecar/release-bench

      - name: Refresh the embedded Sigstore trusted root (TUF)
        working-directory: sidecar
        run: go run ./cmd/sigstore_trusted_root -o internal/benchsig/trusted_root.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the PGIncidentBench reports (keyless)
        working-directory: sidecar/release-bench
        run: |
          set -euo pipefail
          # Ship the shard reports only (the replay report is not ledger
          # evidence and would be refused at every ingest).
          find . -maxdepth 1 -type f ! -name README.md -delete
          reports=(*/pgincidentbench.json)
          test "${#reports[@]}" -eq 3
          for f in "${reports[@]}"; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Verify the signatures (cosign and pg_sage)
        working-directory: sidecar
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          for f in release-bench/*/pgincidentbench.json; do
            cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" "$f"
            go run ./cmd/pg_sage_sidecar bench verify --commit "$GITHUB_SHA" "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: pgincidentbench-signed
          path: sidecar/release-bench/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: sigstore-trusted-root
          path: sidecar/internal/benchsig/trusted_root.json
          if-no-files-found: error

  # Roadmap 2.4: the nightly live-model arm. The replay corpus runs through
  # the causal graph and the LLM-on arm against the cheapest configured
  # OpenAI model, paced and under hard caps (requests, tokens, wall time,
  # estimated spend); a cap fails the run closed. The report carries the
  # held-out model lift the trust ledger reads for each family's model-root
  # authority, and on master or a v* tag it is signed keyless like the
  # release bench (this workflow's identity is the one the sidecar
  # accepts). It also runs on every v* tag, where bench-live-release-assets
  # attaches the signed report to the release; neither release nor docker
  # waits for it. Never on a pull request or a branch push; without the
  # PG_SAGE_BENCH_OPENAI_API_KEY secret it skips with a notice (setup:
  # sidecar/sre-bench/README.md). The model is the repository variable
  # PG_SAGE_BENCH_OPENAI_MODEL, else the default in sre-bench/livemodel.go.
  bench-live:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    services:
      postgres:
        image: ghcr.io/jasonmassie01/pg_sage-ci-pgvector:0.8.2-pg17
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      SAGE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      SAGE_BENCH_REPORT_DIR: ${{ github.workspace }}/pgincidentbench-live
      SAGE_BENCH_PG_SAGE_COMMIT: ${{ github.sha }}
      SAGE_BENCH_PG_SAGE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the live model secret
        id: secret
        env:
          OPENAI_KEY_PRESENT: ${{ secrets.PG_SAGE_BENCH_OPENAI_API_KEY != '' }}
        run: |
          if [ "$OPENAI_KEY_PRESENT" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Live-model bench skipped::The repository secret PG_SAGE_BENCH_OPENAI_API_KEY is not set, so the nightly live-model arm did not run. Setup: sidecar/sre-bench/README.md (Nightly live-model arm)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.secret.outputs.ready == 'true'
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      - name: Prepare PostgreSQL
        if: steps.secret.outputs.ready == 'true'
        run: scripts/ci/setup-test-postgres.sh ${{ job.services.postgres.id }} 17

      # The caps cover one model arm's replay of the corpus, not both: a v*
      # tag measures the review arm (the release's root authority reads its
      # lift); scheduled and manual runs alternate it with the tool-calling
      # investigator by UTC day of the year (even: review, odd: investigator).
      - name: Pick the model arm (alternating nights)
        id: arm
        if: steps.secret.outputs.ready == 'true'
        run: |
          day=$((10#${BENCH_DAY_OF_YEAR:-$(date -u +%j)}))
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || (( day % 2 == 0 )); then
            arm=causal-graph+llm
          else
            arm=causal-graph+investigator
          fi
          echo "arm=$arm" >> "$GITHUB_OUTPUT"
          echo "::notice title=Live-model arm::$arm (UTC day $day)"

      - name: Live-model arm (replay corpus, capped)
        if: steps.secret.outputs.ready == 'true'
        working-directory: sidecar
        env:
          PG_SAGE_LIVE_LLM: "1"
          SAGE_BENCH_LIVE_ARM: "1"
          SAGE_BENCH_LIVE_MODEL_ARM: ${{ steps.arm.outputs.arm }}
          PG_SAGE_BENCH_LLM_URL: ${{ vars.PG_SAGE_BENCH_OPENAI_URL || 'https://api.openai.com/v1' }}
          PG_SAGE_BENCH_LLM_MODEL: ${{ vars.PG_SAGE_BENCH_OPENAI_MODEL }}
          PG_SAGE_BENCH_LLM_KEY: ${{ secrets.PG_SAGE_BENCH_OPENAI_API_KEY }}
          PG_SAGE_BENCH_LLM_RPM: ${{ vars.PG_SAGE_BENCH_LLM_RPM || '30' }}
          PG_SAGE_BENCH_LLM_MAX_REQUESTS: ${{ vars.PG_SAGE_BENCH_LLM_MAX_REQUESTS || '400' }}
          PG_SAGE_BENCH_LLM_MAX_TOKENS: ${{ vars.PG_SAGE_BENCH_LLM_MAX_TOKENS || '2500000' }}
          PG_SAGE_BENCH_LLM_MAX_WALL: ${{ vars.PG_SAGE_BENCH_LLM_MAX_WALL || '45m' }}
          PG_SAGE_BENCH_LLM_MAX_SPEND_USD: ${{ vars.PG_SAGE_BENCH_LLM_MAX_SPEND_USD || '2' }}
          # Empty: the default model's prices (sre-bench/livemodel.go). Set
          # both for any other model, or the run fails closed.
          PG_SAGE_BENCH_LLM_USD_PER_MTOK_IN: ${{ vars.PG_SAGE_BENCH_LLM_USD_PER_MTOK_IN }}
          PG_SAGE_BENCH_LLM_USD_PER_MTOK_OUT: ${{ vars.PG_SAGE_BENCH_LLM_USD_PER_MTOK_OUT }}
        run: go test ./sre-bench -run '^TestLiveModelArm$' -count=1 -timeout 3600s -v

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: >-
          steps.secret.outputs.ready == 'true' &&
          (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))

      # Only a run that passed (no cap reached, no safety gate failed) is
      # signed: a failed run's report stays an unsigned artifact.
      - name: Sign the live-model report (master or a v* tag)
        id: sign
        if: >-
          steps.secret.outputs.ready == 'true' &&
          (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        working-directory: sidecar
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          f="$SAGE_BENCH_REPORT_DIR/pgincidentbench.json"
          cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" "$f"
          go run ./cmd/sigstore_trusted_root -o internal/benchsig/trusted_root.json
          go run ./cmd/pg_sage_sidecar bench verify --commit "$GITHUB_SHA" "$f"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.secret.outputs.ready == 'true' }}
        with:
          name: pgincidentbench-live
          path: pgincidentbench-live/
          if-no-files-found: warn

  # Roadmap 2.4: a v* tag's signed live-model report goes on the GitHub
  # release as assets once both have finished. Only this job waits for
  # bench-live; the release is never held back by it (an unsigned, failed
  # or skipped live run attaches nothing). Ingesting these assets in the
  # sidecar is a follow-up.
  bench-live-release-assets:
    runs-on: ubuntu-latest
    needs: [bench-live, release]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.bench-live.outputs.signed == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pgincidentbench-live
          path: live

      - name: Attach the signed live-model report to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets
          cp live/pgincidentbench.json assets/pgincidentbench-live.json
          cp live/pgincidentbench.json.sigstore.json assets/pgincidentbench-live.json.sigstore.json
          cp live/pgincidentbench.md assets/pgincidentbench-live.md
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            assets/pgincidentbench-live.json \
            assets/pgincidentbench-live.json.sigstore.json \
            assets/pgincidentbench-live.md

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint, bench-sign]
    # master pushes publish :edge and :sha-*; release tags publish the
    # semver tags and move :latest, so :latest is always a release.
    # A tag image needs verified signed bench reports; :edge is published
    # without them when bench-sign fails or is skipped (the sidecar starts
    # cleanly with no shipped reports).
    if: >-
      always() && github.event_name == 'push' &&
      needs.test.result == 'success' && needs.lint.result == 'success' &&
      (github.ref == 'refs/heads/master' ||
       (startsWith(github.ref, 'refs/tags/v') && needs.bench-sign.result == 'success'))
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jasonmassie01/pg_sage
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=master
            type=sha

      # The image carries this commit's signed bench reports at
      # /usr/share/pg_sage/bench (an air-gapped install has them) and the
      # trusted root they were verified with.
      - uses: actions/download-artifact@v4
        if: needs.bench-sign.result == 'success'
        with:
          name: pgincidentbench-signed
          path: sidecar/release-bench

      - uses: actions/download-artifact@v4
        if: needs.bench-sign.result == 'success'
        with:
          name: sigstore-trusted-root
          path: sidecar/internal/benchsig

      - uses: docker/build-push-action@v6
        with:
          context: sidecar/
          file: sidecar/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}

  release:
    runs-on: ubuntu-latest
    needs: [test, bench-sign]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Rebuild the embedded dashboard from the tagged sources so the shipped UI
      # always matches them. The rebuild changes asset hashes versus the
      # committed build (it is made on another OS), which leaves the tree
      # "dirty", so goreleaser's git-state validation is skipped
      # (--skip=validate); the checkout is the exact tag.
      - name: Build web UI
        run: cd sidecar/web && npm ci && npm run build

      # Roadmap 1.1: the archives carry the signed bench reports in bench/
      # next to the binary, and the release lists them as assets.
      - uses: actions/download-artifact@v4
        with:
          name: pgincidentbench-signed
          path: bench

      - uses: actions/download-artifact@v4
        with:
          name: sigstore-trusted-root
          path: sidecar/internal/benchsig

      - name: Stage the signed bench reports as release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for shard in core reactive runway; do
            for ext in json json.sigstore.json md; do
              cp "bench/$shard/pgincidentbench.$ext" "release-assets/pgincidentbench-$shard.$ext"
            done
          done

      # cgo release: goreleaser-cross carries a C cross-compiler per target
      # (osxcross for darwin) so libpg_query links into every binary.
      - name: GoReleaser (cgo cross-compile)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e GITHUB_TOKEN -v "$PWD:/repo" -w /repo \
            --entrypoint bash ghcr.io/goreleaser/goreleaser-cross:v1.25.0 -c \
            'git config --global --add safe.directory /repo &&
             goreleaser release --clean --skip=before,validate'
