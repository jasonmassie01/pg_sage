
# pg_sage CI test server (ci-03b, scripts/ci/images/Dockerfile.pg).
# HypoPG is created per test; pg_hint_plan and pg_stat_statements are
# preloaded. Logical WAL and prepared transactions are for the suites that
# need them. pg_stat_statements keeps 50000 entries instead of 5000: the
# parallel suite runs more distinct statements than 5000, and evictions
# erased the probe entries tests measure.
# scripts/ci/verify-test-postgres.sh checks every setting here on the server.
shared_preload_libraries = 'pg_stat_statements,pg_hint_plan'
wal_level = logical
max_prepared_transactions = 10
pg_stat_statements.max = 50000
# The parallel suites hold more than the default 100 connections at once:
# with 100, CI failed tests with "sorry, too many clients already".
max_connections = 300
