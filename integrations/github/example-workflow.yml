# pg_sage Change Review on every pull request. Copy this file to
# .github/workflows/pg-sage-review.yml and set:
#   - the repository secret PG_SAGE_TOKEN: a pg_sage MCP token with the read and
#     propose scopes, bound to the one database below, with an expiry
#     (docs/change-review.md, "Create the token");
#   - PG_SAGE_URL and PG_SAGE_DATABASE below. The runner must reach pg_sage's
#     MCP endpoint (a self-hosted runner, or a bastion).
# pg_sage only reads: it plans with EXPLAIN (never ANALYZE), runs session-local
# HypoPG what-ifs and never runs the migration. It holds no GitHub credentials:
# the comment and the commit status are written with this workflow's own token.
name: pg_sage database review

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Refresh the status of open pull requests (a DBA verdict recorded in pg_sage).
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pull-requests: write
  statuses: write

env:
  PG_SAGE_URL: https://pg-sage.example.com:8080
  PG_SAGE_DATABASE: orders

concurrency:
  group: pg-sage-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Skip fork pull requests (no pg_sage token)
        id: fork
        env:
          PG_SAGE_TOKEN: ${{ secrets.PG_SAGE_TOKEN }}
        run: |
          if [ -z "$PG_SAGE_TOKEN" ]; then
            echo "::notice::pg_sage review skipped: repository secrets are not available to this pull request"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the pull request with its base
        if: steps.fork.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review the change with pg_sage
        if: steps.fork.outputs.skip != 'true'
        uses: jasonmassie01/pg_sage/integrations/github/pg-sage-review@v2.4.0
        with:
          version: v2.4.0
          url: ${{ env.PG_SAGE_URL }}
          database: ${{ env.PG_SAGE_DATABASE }}
          token: ${{ secrets.PG_SAGE_TOKEN }}
          sql-dir: db/migrate
          fail-on: risky

  status:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Install pg_sage
        uses: jasonmassie01/pg_sage/integrations/github/pg-sage-review@v2.4.0
        with:
          version: v2.4.0
          url: ${{ env.PG_SAGE_URL }}
          database: ${{ env.PG_SAGE_DATABASE }}
          token: ${{ secrets.PG_SAGE_TOKEN }}
          command: install

      - name: Refresh pg_sage review status on open pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pg_sage review status --github --url "$PG_SAGE_URL" --database "$PG_SAGE_DATABASE" --fail-on risky
