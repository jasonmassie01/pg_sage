apiVersion: v1
kind: Service
metadata:
  name: {{ include "pg-sage.fullname" . }}
  labels:
    {{- include "pg-sage.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "pg-sage.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: 8080
      targetPort: api
    - name: metrics
      port: 8187
      targetPort: metrics
