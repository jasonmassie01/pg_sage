{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pg-sage.fullname" . }}
  labels:
    {{- include "pg-sage.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pg-sage.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: api
        - port: metrics
      {{- with .Values.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
