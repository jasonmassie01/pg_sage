command: ['python', 'launch.py']
env:
  - name: DATABRICKS_AUTH_TYPE
    value: oauth-m2m
  # Fill in the exact dedicated test branch endpoint and database, then attach
  # its postgres resource to the app. PGUSER defaults to DATABRICKS_CLIENT_ID.
  - name: PGHOST
    value: '<lakebase-endpoint-host>'
  - name: PGDATABASE
    value: '<dedicated-database>'
  - name: PGSSLMODE
    value: 'verify-full'
  - name: SAGE_LAKEBASE_ENDPOINT
    value: 'projects/<project>/branches/<branch>/endpoints/<endpoint>'
  - name: SAGE_ENCRYPTION_KEY
    valueFrom: sage-encryption-key
  - name: SAGE_AUTH_MODE
    value: databricks_app
  - name: SAGE_DATABRICKS_ADMIN_EMAIL
    value: '<explicit-admin-email>'
  - name: SAGE_TRUST_LEVEL
    value: observation
  # Optional Unity AI Gateway configuration. Model and endpoint must match
  # a connection/route the app service principal is permitted to invoke.
  # - name: SAGE_LLM_AUTH
  #   value: databricks
  # - name: SAGE_LLM_ENDPOINT
  #   value: '<openai-compatible-base-url>'
  # - name: SAGE_LLM_MODEL
  #   value: '<model-or-route-name>'
