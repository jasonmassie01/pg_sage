version: "2"

run:
  timeout: 5m
  # ci-04: lint the tagged suites too. The live suites (providerlive,
  # cloudlive, convertscale) are compiled by the CI tagged vet step.
  build-tags:
    - integration
    - e2e
    - perfgate

linters:
  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - os.Chdir
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - staticcheck
      - path: internal/executor/ddl.go
        text: "Error return value of `tx.Rollback`"
      - path: internal/schema/bootstrap.go
        text: "Error return value of `tx.Rollback`"
    paths:
      - testdata
