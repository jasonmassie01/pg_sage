version: 2

project_name: pg_sage

before:
  hooks:
    - bash -c "cd sidecar/web && npm ci && npm run build"

builds:
  - id: pg_sage_sidecar
    main: ./cmd/pg_sage_sidecar/
    dir: sidecar
    binary: pg_sage
    # cgo links libpg_query for parse-tree SQL validation (internal/sqlast).
    # The release job runs in goreleaser-cross, which carries a C
    # cross-compiler per target (osxcross for darwin). Linux binaries are
    # static so they run on any distribution.
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    overrides:
      - goos: linux
        goarch: amd64
        env: [CC=x86_64-linux-gnu-gcc]
        tags: &static_tags [netgo, osusergo]
        ldflags: &static_ldflags
          - -s -w -linkmode external -extldflags "-static"
          - -X main.version={{.Version}}
          - -X main.commit={{.Commit}}
          - -X main.date={{.Date}}
      - goos: linux
        goarch: arm64
        env: [CC=aarch64-linux-gnu-gcc]
        tags: *static_tags
        ldflags: *static_ldflags
      - goos: darwin
        goarch: amd64
        env: [CC=o64-clang]
      - goos: darwin
        goarch: arm64
        env: [CC=oa64-clang]

archives:
  - id: default
    formats: [tar.gz]
    name_template: "pg_sage_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - config.example.yaml
      # Roadmap 1.1: this commit's signed PGIncidentBench reports (the
      # release job downloads them to bench/); the sidecar ingests
      # bench/ next to its binary at startup.
      - bench/*/*

checksum:
  name_template: "checksums.txt"

# ci-05: a keyless Sigstore signature over checksums.txt (GitHub OIDC; the
# release job passes the token request into the container), with the
# identity and issuer of the signed bench reports. docs/installation.md
# shows cosign verify-blob on checksums.txt.sigstore.json.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    output: true

# ci-05: an SPDX SBOM per archive (syft), published as <archive>.sbom.json.
sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: jasonmassie01
    name: pg_sage
  # The signed bench reports and their Sigstore bundles, per shard, and
  # the packaged Helm chart (pg-sage-<version>.tgz, market-12).
  extra_files:
    - glob: ./release-assets/*
  name_template: "v{{.Version}}"
  # ci-05: a draft until the release job has smoke-tested the archived
  # binary; that job then publishes it.
  draft: true
  # A rerun of the release job (a flaky Rekor call, a failed smoke test)
  # deletes the draft the failed run left, so the publish step finds only
  # this run's verified draft for the tag.
  replace_existing_draft: true
  prerelease: auto
