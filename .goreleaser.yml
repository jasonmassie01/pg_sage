version: 2

project_name: pg_sage

before:
  hooks:
    - bash -c "cd sidecar/web && npm ci && npm run build"

builds:
  - id: pg_sage_sidecar
    main: ./cmd/pg_sage_sidecar/
    dir: sidecar
    binary: pg_sage
    # cgo links libpg_query for parse-tree SQL validation (internal/sqlast).
    # The release job runs in goreleaser-cross, which carries a C
    # cross-compiler per target (osxcross for darwin). Linux binaries are
    # static so they run on any distribution.
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    overrides:
      - goos: linux
        goarch: amd64
        env: [CC=x86_64-linux-gnu-gcc]
        tags: &static_tags [netgo, osusergo]
        ldflags: &static_ldflags
          - -s -w -linkmode external -extldflags "-static"
          - -X main.version={{.Version}}
          - -X main.commit={{.Commit}}
          - -X main.date={{.Date}}
      - goos: linux
        goarch: arm64
        env: [CC=aarch64-linux-gnu-gcc]
        tags: *static_tags
        ldflags: *static_ldflags
      - goos: darwin
        goarch: amd64
        env: [CC=o64-clang]
      - goos: darwin
        goarch: arm64
        env: [CC=oa64-clang]

archives:
  - id: default
    formats: [tar.gz]
    name_template: "pg_sage_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - config.example.yaml
      # Roadmap 1.1: this commit's signed PGIncidentBench reports (the
      # release job downloads them to bench/); the sidecar ingests
      # bench/ next to its binary at startup.
      - bench/*/*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: jasonmassie01
    name: pg_sage
  # The signed bench reports and their Sigstore bundles, per shard.
  extra_files:
    - glob: ./release-assets/*
  name_template: "v{{.Version}}"
  draft: false
  prerelease: auto
